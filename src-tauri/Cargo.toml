[package]
name = "urtk-flow"
version = "1.3.1"
description = "URTK Flow — Расписание, консультации и виджеты рабочего стола для УРТК им. А.С. Попова"
authors = ["URTK Student"]
edition = "2021"
default-run = "urtk-flow"

[lib]
name = "urtk_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
csv = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_Memory"] }
winreg = "0.56"

[profile.release]
lto = false
opt-level = 2
panic = "abort"
strip = true
